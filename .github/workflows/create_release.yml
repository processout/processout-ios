name: Create Release
on: 
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-release:
    name: Create Release
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Bootstrap Project
        uses: ./.github/actions/bootstrap-project
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 #v2
        with:
          app-id: ${{ vars.CKO_PUBLIC_WRITE_APP_ID }}
          private-key: ${{ secrets.CKO_PUBLIC_WRITE_APP_KEY }}
          owner: processout
          repositories: processout-ios
      - name: Create Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: source Scripts/CreateRelease.sh
